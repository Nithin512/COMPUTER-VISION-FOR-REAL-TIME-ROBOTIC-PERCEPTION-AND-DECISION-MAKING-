project_title: Computer Vision for Real-Time Robotic Perception and Decision-Making
mode: protocol_first

paths:
  raw_data: data/raw
  processed_data: data/processed
  figures: outputs/figures
  tables: outputs/tables
  logs: outputs/logs

evaluation:
  target_runtime_fps: 15
  target_latency_ms: 67
  decision_confidence_threshold: 0.65
  edge_salience_threshold: 0.18

figure_style:
  policy: architecture/visual-style-policy.md
  background: "#FFFFFF"
  primary: "#183B56"
  secondary: "#486581"
  accent: "#2F80ED"
  highlight: "#56B4A9"
  light_fill: "#EAF2F8"
  neutral_fill: "#F4F6F8"
  border: "#BCCCDC"
